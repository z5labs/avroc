name: Release

# A published release is the trigger, not a pushed tag. The distinction matters
# for what this workflow does: it uploads an asset onto a release object, and a
# release object only exists once somebody has published one. Firing on the tag
# would mean racing the human who is about to create the release, and losing
# that race means uploading to a release that is not there yet.
#
# `published` covers both a release created straight away and a draft released
# later, which is the shape a release with notes to write actually takes.
on:
  release:
    types: [published]

# The floor for every job. The one job that has to write says so itself.
permissions:
  contents: read

jobs:
  # The IR's FileDescriptorSet, attached to the release as ir.binpb.
  #
  # It is here so that a plugin author whose language has no protobuf code
  # generation in the build can fetch one file and decode a descriptor
  # dynamically — docs/ir/SPEC.md's "Reading a descriptor without generated
  # code". The same bytes ship inside the published image at
  # /usr/local/share/avroc/ir.binpb (docs/container/SPEC.md); a release asset is
  # the form for somebody who is not using the image at all, and neither is a
  # substitute for the other.
  ir-descriptor-set:
    name: IR FileDescriptorSet
    runs-on: ubuntu-latest
    permissions:
      # Reading the source, and writing the one asset onto the release. Nothing
      # else on this workflow needs either, which is why the grant is on the job
      # rather than at the top of the file.
      contents: write
    # The `dagger call` below publishes its trace to Dagger Cloud, because the
    # CLI uploads whenever a Cloud token is in its environment — the same one
    # line as build.yaml's, on the run where finding out afterwards is worst. A
    # release happens once and the tag is never repointed, so the run that
    # produced it is the one whose trace is worth having.
    #
    # Per job rather than at the top of the file, so the token's scope is what
    # uses it: it reaches the CLI and stops there, and nothing the module builds
    # is given it.
    #
    # One-time setup: sign in to Dagger Cloud, open the organisation's Settings
    # -> Tokens (https://dagger.cloud/<org>/settings?tab=Tokens), and add the
    # value as a repository secret named DAGGER_CLOUD_TOKEN. It is an ingest
    # credential for that organisation's traces and grants nothing in this
    # repository. DAGGER_CLOUD_TOKEN is the name the pinned engineVersion reads
    # — _EXPERIMENTAL_DAGGER_CLOUD_TOKEN is the name it replaced, and v0.21.8
    # does not look at it.
    env:
      DAGGER_CLOUD_TOKEN: ${{ secrets.DAGGER_CLOUD_TOKEN }}
    steps:
      # At the release's tag, not at whatever main has moved to since. The
      # artifact is a function of the source, so an asset built from a different
      # commit would describe an IR that release never shipped.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.release.tag_name }}

      # Pinned to the engineVersion the module declares, read out of dagger.json
      # rather than repeated here — the same step, for the same reason, as
      # build.yaml's.
      - name: Install the Dagger CLI
        run: |
          curl -fsSL https://dl.dagger.io/dagger/install.sh \
            | DAGGER_VERSION="$(jq -r .engineVersion dagger.json | tr -d v)" \
              BIN_DIR="$HOME/.local/bin" sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # Degrade loudly, not silently: without the secret the release still runs
      # and simply publishes no trace. There is no fork case to exclude here as
      # there is in build.yaml — a release event only ever fires in this
      # repository, so a missing token is always something an operator can fix.
      - name: Warn when no trace will be published
        if: env.DAGGER_CLOUD_TOKEN == ''
        run: |
          echo "::warning title=No Dagger Cloud trace::DAGGER_CLOUD_TOKEN is unset, so \
          this release publishes no trace. See the comment on this job for where an \
          operator gets one."

      # The same function CI builds on every pull request and a contributor runs
      # locally, so the released asset is produced by the recipe that has already
      # been exercised rather than by one that only ever runs at release time.
      - name: Build the IR FileDescriptorSet
        run: dagger call ir-descriptor-set export --path "$RUNNER_TEMP/ir.binpb"

      # --clobber so that re-running a failed release job replaces the asset
      # instead of failing on a name that is already taken. The bytes are a
      # function of the tag's source, so a re-upload cannot change what the
      # asset says.
      - name: Attach it to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            "$RUNNER_TEMP/ir.binpb" --clobber

  # The published base image (#126) — the one docs/container/SPEC.md describes
  # and strangers' Dockerfiles say FROM — and the three generator images built
  # FROM it (#127).
  #
  # One job rather than two, because the four images are one release: a base
  # published without its generator images would leave every `FROM` line in this
  # repository's own documentation naming a tag whose generators are a release
  # behind, and the generator images are built from the same base this job
  # checked, so splitting them would mean building it twice.
  #
  # Which tags exist, and whether this commit is a release at all, is decided by
  # the module from the refs at HEAD (#128) — not by an `if:` here and not by a
  # tag assembled in the step below. A workflow that decided would have to write
  # the tag scheme down to do it, in a file that runs once per release and is
  # exercised nowhere else; `dagger call tag-scheme` runs the same derivation on
  # every pull request. What is left here is *where* to publish and what
  # credentials to publish with, which genuinely are properties of this
  # deployment rather than of the release.
  image:
    name: Images
    runs-on: ubuntu-latest
    permissions:
      # Reading the source, writing the package, and minting the OIDC token that
      # signs it. All three are here rather than at the top of the file because
      # this is the only job that pushes or signs anything, and a grant held in
      # advance is one nothing accounts for. `id-token: write` arrives in the
      # same change as the signing step that needs it: it is what lets the run
      # ask GitHub for the workload identity token cosign exchanges for a
      # short-lived certificate, and it is also what puts
      # ACTIONS_ID_TOKEN_REQUEST_URL and ACTIONS_ID_TOKEN_REQUEST_TOKEN in the
      # step environment below.
      contents: read
      packages: write
      id-token: write
    # The three `dagger call`s below publish their traces, for the reason the
    # job above gives and with the same one-time setup — the account of what
    # this secret is and where an operator gets one is on that job, a screen up
    # in this file. It is repeated per job rather than hoisted to the workflow
    # because the scope of the token should be what reads it.
    #
    # It is not passed to `dagger call release` and must not be. That call
    # already carries the registry password and the identity token; the Cloud
    # token is the CLI's own and has no business inside anything the module
    # builds.
    env:
      DAGGER_CLOUD_TOKEN: ${{ secrets.DAGGER_CLOUD_TOKEN }}
    steps:
      # At the release's tag, for the same reason the asset above is built
      # there: the image is a function of the source, and an image built from a
      # different commit would be a different program wearing the tag.
      #
      # With full history and tags, because the module reads the refs at HEAD to
      # decide what this release is. A shallow checkout without tags has no
      # version tag pointing at HEAD, so the release step would correctly
      # conclude there is nothing to publish and push nothing at all.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
          fetch-tags: true

      - name: Install the Dagger CLI
        run: |
          curl -fsSL https://dl.dagger.io/dagger/install.sh \
            | DAGGER_VERSION="$(jq -r .engineVersion dagger.json | tr -d v)" \
              BIN_DIR="$HOME/.local/bin" sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # As on the job above, and for the same reason: the publish is the run
      # where reading a failure out of the log by eye costs the most.
      - name: Warn when no trace will be published
        if: env.DAGGER_CLOUD_TOKEN == ''
        run: |
          echo "::warning title=No Dagger Cloud trace::DAGGER_CLOUD_TOKEN is unset, so \
          this release publishes no trace. See the comment on this job for where an \
          operator gets one."

      # The same contract check CI runs on every pull request, run once more
      # against the tag before anything is pushed. A tag is published once and
      # never repointed, so this is the last moment at which a broken promise
      # costs nothing.
      - name: Check the base image against its contract
        run: dagger call image-contract

      # And the images built FROM it, for the same reason: a tag is published
      # once and never repointed, so this is the last moment at which a generator
      # image that had stopped inheriting the entrypoint costs nothing.
      - name: Check the generator images against the contract
        run: dagger call generator-image-contract

      # One call publishes all four images — the base and one per built-in
      # generator — as multi-platform indexes covering linux/amd64 and
      # linux/arm64, under every tag docs/container/SPEC.md's tag table gives
      # this release, and signs each published digest with a SLSA provenance
      # statement and an SPDX SBOM beside it (#128).
      #
      # Neither the set of images nor the set of tags is written here. The
      # generators come from the module, because that is where the set is
      # defined; a `for name in go json pcf` in this file would be forgotten
      # exactly once, at the release where a fourth generator silently did not
      # get published. The tags come from the refs at HEAD, for the reason this
      # job's comment gives. What this step supplies is the base repository —
      # the generator repositories derive from it as `<base>-gen-<name>`, the
      # naming that document already uses — and the credentials.
      #
      # The two ACTIONS_ID_TOKEN_REQUEST_* variables are put in the environment
      # by `id-token: write` above. They are the workload identity exchange:
      # cosign trades a token minted from them for a short-lived sigstore
      # certificate, so the signature says which workflow at which ref produced
      # the image rather than which key somebody is holding. The token is passed
      # as a secret because it mints identity tokens for this repository.
      - name: Publish, sign and attest the images
        env:
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dagger call release \
            --repository "ghcr.io/${{ github.repository }}" \
            --username "${{ github.actor }}" \
            --password env://REGISTRY_PASSWORD \
            --id-token-request-url "$ACTIONS_ID_TOKEN_REQUEST_URL" \
            --id-token-request-token env://ACTIONS_ID_TOKEN_REQUEST_TOKEN \
            --builder "${{ github.server_url }}/${{ github.workflow_ref }}" \
            --invocation "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
