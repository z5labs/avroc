name: CI

on:
  pull_request:
  push:
    branches:
      - main
  merge_group:

# A pull request only needs an answer about its newest commit. Superseded runs
# are cancelled so the queue reflects what is actually up for review. Pushes to
# main keep their runs — main's history is the record.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The floor for every job. A job that needs more says so itself, so that reading
# one job tells you what that job can reach.
permissions:
  contents: read

jobs:
  # The whole pipeline: fmt, vet, golangci-lint and `go test -race`, as the root
  # Dagger module defines them and as `dagger call ci` runs them on a
  # contributor's machine. It is one call and it stays one — a step here that
  # reran any of those stages would be a second definition of the standard, and
  # the two would drift. See CONTRIBUTING.md and .dagger/main.go.
  #
  # Repo-specific verification lands in this workflow the same way: as another
  # function on the root module invoked by another `dagger call`, never as raw
  # Go steps beside it. That is why the example round-trip is the
  # `dagger call regeneration` step below rather than a handful of `go build`
  # steps here, and why the ubuntu/macos/windows matrix this file used to carry
  # is gone: Dagger runs Linux containers, so a matrix over runners buys nothing
  # once the pipeline is a container, and the Windows half of it has no target
  # left to check — avroc targets POSIX hosts, as docs/plugin/SPEC.md records.
  # The platforms that do still differ are covered inside the module, by the
  # regeneration stage, which runs on each of them.
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      # Reading the source is all this job does. No `packages: write`, because
      # nothing is pushed; no `id-token: write`, because nothing is attested.
      # The module does now produce an artifact — the IR FileDescriptorSet
      # below — but this job only builds it and throws it away; the grant that
      # publishes it lives on the job that publishes it, in release.yaml.
      contents: read
    steps:
      # A shallow checkout on purpose. The module excludes .git from the source
      # directory it checks, because none of fmt, vet, lint or test reads git
      # metadata, so there is nothing here for the extra history to feed. That
      # changes with the archetype: a GoApp stamps binaries from the refs at
      # HEAD and needs real metadata, so `fetch-depth: 0` comes back in the same
      # change that drops .git from the module's ignore list.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Pinned to the engineVersion the module itself declares, read out of
      # dagger.json rather than repeated here. The CLI provisions an engine of
      # its own version, so a number typed into this file could drift from the
      # module's and leave CI running the pipeline on an engine the module has
      # never been run against — which is the difference between this repository
      # and every other one that the module exists to prevent. It is the same
      # command CONTRIBUTING.md gives contributors, for the same reason.
      - name: Install the Dagger CLI
        run: |
          curl -fsSL https://dl.dagger.io/dagger/install.sh \
            | DAGGER_VERSION="$(jq -r .engineVersion dagger.json | tr -d v)" \
              BIN_DIR="$HOME/.local/bin" sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # No arguments, because the module's source defaults to the repository
      # root and its lint configuration defaults to the .golangci.yml committed
      # beside it. This is character-for-character what a contributor runs
      # before pushing, so there is no arrangement of local commands that passes
      # while CI fails.
      - name: Run the pipeline
        run: dagger call ci

      # docs/plugin/SPEC.md's determinism requirement, checked rather than
      # asserted (#120). It builds the four binaries for each platform the image
      # ships on, generates the worked example twice under deliberately
      # different surroundings — different absolute paths, working directory,
      # temporary directory, user, hostname, locale and time zone — and requires
      # the two trees to be byte-identical, and identical to what is committed.
      #
      # It is a separate call rather than part of `ci` because `ci` is the
      # Z5Labs standard pipeline and this is avroc's own, not a stage every
      # Z5Labs repository has. Determinism is the kind of property that holds
      # until nobody is looking, and generated code that changes when nothing
      # changed makes the committed output worthless.
      - name: Check that regeneration is byte-identical
        run: dagger call regeneration

      # docs/container/SPEC.md's compatibility guarantees table, executed
      # rather than read (#126). It builds the published base image for each
      # platform it ships on and checks every promise that document makes about
      # it: the plugin directory and its place on PATH, the entrypoint, the
      # empty Cmd, the working directory, the pinned non-root UID, the absence
      # of a shell — as an exact listing of every path in the image — the
      # FileDescriptorSet's path, and the image actually generating the worked
      # example through its own entrypoint, as itself and as an overridden UID.
      #
      # It runs on every pull request rather than only at release time because
      # each of those promises is depended on from a repository this project
      # cannot see, and breaks without breaking anything here: an image whose
      # PATH lost /usr/local/bin runs avroc perfectly and fails at the point
      # where somebody else's generator is not found. Nothing is pushed, so
      # this job still needs no `packages: write`; release.yaml is what
      # publishes.
      - name: Check the base image against its contract
        run: dagger call image-contract

      # The one artifact this repository builds, built on every pull request
      # rather than only at release time. Its contents are asserted by the tests
      # `dagger call ci` just ran — that the set covers proto/, resolves on its
      # own and decodes a descriptor leaving nothing undescribed — and what this
      # step adds is that the artifact still *builds*, so a release is never the
      # first time anybody finds out that it does not. It is exported to the
      # runner's temporary directory and discarded; release.yaml is what
      # publishes it.
      - name: Build the IR FileDescriptorSet
        run: dagger call ir-descriptor-set export --path "$RUNNER_TEMP/ir.binpb"
