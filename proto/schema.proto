edition = "2023";

option go_package = "github.com/z5labs/avroc/avrocpb;avrocpb";

import "avro_type.proto";

// Schema represents a schema in the Avro IDL.
message Schema {
    string namespace = 1;
    Type type = 2;
    repeated Type types = 3;
}